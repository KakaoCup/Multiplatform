name: Publish All Libraries Release

# Manually triggered release of every library at once.
# Each library runs as its own parallel job via the shared release workflow,
# and a failure in one does not cancel the others.
on:
  workflow_dispatch:

jobs:
  publish-release:
    name: Publish ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # :compose is Kotlin Multiplatform, its iOS artifacts are built on macOS
          - project: compose
            runner: macos-latest
          - project: compose-semantics
            runner: ubuntu-latest
          - project: compose-test
            runner: ubuntu-latest
          - project: compose-ui
            runner: ubuntu-latest
    uses: ./.github/workflows/publish-release-workflow.yaml
    with:
      project: ${{ matrix.project }}
      runner: ${{ matrix.runner }}
    secrets: inherit

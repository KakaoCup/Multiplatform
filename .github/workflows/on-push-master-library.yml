name: On Push into Master

on:
  push:
    paths-ignore:
      - 'documentation/**'
    branches:
      - master

jobs:
  deploy-osshr:
    name: Deploy to OSSHR
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # :compose-multiplatform is Kotlin Multiplatform, its iOS artifacts are built on macOS
          - package: compose-multiplatform
            runner: macos-latest
          - package: compose-multiplatform-semantics
            runner: macos-latest
          - package: compose-multiplatform-test
            runner: ubuntu-latest
          - package: compose-multiplatform-ui
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17
          cache: gradle
      - uses: little-core-labs/get-git-tag@v3.0.2

      - name: Deploy Snapshot to OSSRH
        run: ./gradlew :$PACKAGE:publishAllPublicationsToOSSHRRepository -PreleaseMode=SNAPSHOT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PACKAGE: ${{ matrix.package }}
